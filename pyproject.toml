[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mypy-units"
version = "0.1.0"
description = "Mypy plugin for static physical-unit dimensionality checking via Pint"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Dylan Baumann", email = "dbaumann@ecs.tuwien.ac.at" },
]
keywords = ["mypy", "plugin", "pint", "units", "dimensional-analysis", "type-checking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pint>=0.23",
    "mypy>=1.8",
]

[project.optional-dependencies]
numpy  = ["numpy>=1.24"]
pintrs = ["pintrs"]
test   = ["pytest>=8.0", "pytest-cov>=5.0", "numpy>=1.24", "ruff>=0.4"]
dev    = ["mypy-units[test]", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage   = "https://github.com/Bawady/mypy-units"
Repository = "https://github.com/Bawady/mypy-units"
Issues     = "https://github.com/Bawady/mypy-units/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mypy_units*"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["mypy_units.plugin"]

[[tool.mypy.overrides]]
module = ["mypy_units.*"]
warn_unused_ignores = false
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["pintrs"]
ignore_missing_imports = true

# scipy ships no type information (no py.typed); the mypy_units.scipy wrappers
# route results through Any, so missing stubs are expected and harmless.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "UP"]
# N816: degC/degF are conventional scientific abbreviations used across the
# whole scientific Python ecosystem (pint, astropy, etc.) — renaming would
# surprise users who look these up in documentation.
ignore = ["N816"]

[tool.ruff.lint.per-file-ignores]
# Examples use standard physics notation: P1/V1/T1 (gas laws), L (length),
# P2 as a local variable, etc.  Forcing snake_case here would make the
# formulas harder to read and inconsistent with every textbook.
"examples/*.py" = ["N803", "N806"]

[tool.coverage.run]
source = ["mypy_units"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "jax>=0.10.1",
]
